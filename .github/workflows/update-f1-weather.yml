name: Update F1 True Conditions database

on:
  schedule:
    # every hour (UTC). OpenF1 is locked while any F1 session is live (and shortly before), so on race
    # weekends many runs find it locked and stop without changes in a few seconds; hourly runs make
    # sure one lands in the gap after each session. GitHub also sometimes delays or skips scheduled runs.
    - cron: '17 * * * *'
  workflow_dispatch:           # "Run workflow" button in the Actions tab

permissions:
  contents: write              # lets the job commit the updated CSV

concurrency:
  group: f1-weather
  cancel-in-progress: false

env:
  WEATHER_DIR: .               # folder that contains tools/ and data/ (e.g. f1-real-weather)

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Update database
        run: python "$WEATHER_DIR/tools/update_db.py" --out "$WEATHER_DIR/data/f1_weather_db.csv"

      - name: Commit if changed
        run: |
          # everything the updater writes in data/ (weather files, sector lines, and any file added later)
          git add -A "$WEATHER_DIR/data/"
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git config user.name  "f1-weather-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update F1 weather database ($(date -u +'%Y-%m-%d %H:%M UTC'))"
          git push
